# Stack de production : image immuable (Dockerfile), pas de bind mount, pas
# d'outils de dev. Usage : docker compose -f docker-compose.prod.yml up -d --build
# Projet distinct du dev pour ne jamais partager ses volumes (BDD comprise).
name: demokratsika-prod

x-app: &app
    build:
        context: .
        dockerfile: Dockerfile
    # Surchargeable pour déployer une image de la CI : APP_IMAGE=ghcr.io/…:sha-xxxxxxx
    image: ${APP_IMAGE:-demokratsika:latest}
    env_file: .env
    environment:
        APP_ENV: production
        APP_DEBUG: 'false'
        INERTIA_SSR_URL: http://ssr:13714
    restart: unless-stopped
    volumes:
        # Fichiers uploadés (disques local/public) : persistés hors de l'image.
        - storage:/app/storage/app

x-backing-services: &backing-services
    pg:
        condition: service_healthy
    redis:
        condition: service_healthy

services:
    # Migrations jouées une fois avant le démarrage des processus applicatifs.
    migrate:
        <<: *app
        command: ['php', 'artisan', 'migrate', '--force']
        restart: 'no'
        healthcheck:
            disable: true
        depends_on: *backing-services

    app:
        <<: *app
        ports: ['8080:8080']
        depends_on:
            <<: *backing-services
            migrate:
                condition: service_completed_successfully
            ssr:
                condition: service_started

    # Serveur Node de rendu côté serveur Inertia, interne au réseau Compose.
    # S'il tombe, Laravel bascule automatiquement sur le rendu client.
    ssr:
        <<: *app
        command: ['php', 'artisan', 'inertia:start-ssr']
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost:13714/health']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    worker:
        <<: *app
        command: ['php', 'artisan', 'horizon']
        # Laisse à Horizon le temps de terminer les jobs en cours (SIGTERM).
        stop_grace_period: 60s
        healthcheck:
            disable: true
        depends_on:
            <<: *backing-services
            migrate:
                condition: service_completed_successfully

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        healthcheck:
            disable: true
        depends_on:
            <<: *backing-services
            migrate:
                condition: service_completed_successfully

    pg:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE manquant dans .env}
            POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME manquant dans .env}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
        volumes: ['pg-data:/var/lib/postgresql']
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 30s

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        # AOF : la file Horizon survit à un redémarrage de Redis.
        command: ['redis-server', '--appendonly', 'yes']
        volumes: ['redis-data:/data']
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    pg-data:
    redis-data:
    storage:
