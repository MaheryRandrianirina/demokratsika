name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-quality:
    name: PHP quality (Pint, PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup application
        uses: ./.github/actions/setup-php-app

      - name: Check code style (Pint)
        run: vendor/bin/pint --parallel --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PHP is required: the Wayfinder Vite plugin generates the TS route helpers via Artisan.
      - name: Setup application
        uses: ./.github/actions/setup-php-app

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Lint & format check
        run: npm run check

      - name: Type check
        run: npm run types:check

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: public/build
          if-no-files-found: error
          retention-days: 1

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.database }})
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        database: [sqlite]
        include:
          # Production runs on PostgreSQL: exercise migrations & queries against it too.
          - php: '8.4'
            database: pgsql

    services:
      postgres:
        # An empty image skips the service for the SQLite jobs.
        image: ${{ matrix.database == 'pgsql' && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup application
        uses: ./.github/actions/setup-php-app
        with:
          php-version: ${{ matrix.php }}

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: public/build

      # Real env vars take precedence over the non-forced <env> entries of phpunit.xml.
      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.database == 'pgsql' && 'testing' || ':memory:' }}
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  # Single stable check to mark as "required" in branch protection, regardless of the matrix.
  ci-success:
    name: CI success
    if: always()
    needs: [php-quality, frontend, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
