name: Setup PHP application
description: Install PHP, restore the Composer cache, install dependencies and prepare the Laravel environment.

inputs:
  php-version:
    description: PHP version to install.
    required: false
    default: '8.4'
  coverage:
    description: Coverage driver (none, xdebug, pcov).
    required: false
    default: none

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: intl, pcntl, pdo_sqlite, pdo_pgsql, zip
        tools: composer:v2
        coverage: ${{ inputs.coverage }}

    - name: Resolve Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ inputs.php-version }}-${{ hashFiles('composer.lock') }}
        restore-keys: composer-${{ runner.os }}-${{ inputs.php-version }}-

    - name: Prepare environment file
      shell: bash
      run: cp .env.example .env

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-interaction --no-progress --prefer-dist

    - name: Generate application key
      shell: bash
      run: php artisan key:generate --ansi
